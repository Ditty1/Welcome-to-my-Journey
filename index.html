<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditty Denny | Welcome to my Journey</title>
<meta name="description" content="A cinematic walk through Ditty Denny’s journey: Kerala, Qatar, Scotland and Dubai, in code, data and FinTech.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@property --sky1{syntax:'<color>';inherits:true;initial-value:#6FC0EE}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#FFE3B8}
@property --ground{syntax:'<color>';inherits:true;initial-value:#5FA35A}
:root{
  --card:#FFFFFFF0; --ink:#1D2333; --muted:#596179; --line:#E2E5EE; --accent:#6A45D1; --accent-ink:#FFFFFF; --gold:#B7791F; --dim:transparent;
  --ch:clamp(170px,30vh,270px); --feet:13vh; --gl:14vw;
  --cine:"Cinzel",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --card:#1B2131F0; --ink:#EEF1F8; --muted:#A7B0C6; --line:#30384C; --accent:#A68CFF; --accent-ink:#17121F; --gold:#E7B460; --dim:rgba(8,12,28,.26);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --card:#1B2131F0; --ink:#EEF1F8; --muted:#A7B0C6; --line:#30384C; --accent:#A68CFF; --accent-ink:#17121F; --gold:#E7B460; --dim:rgba(8,12,28,.26);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#0B0E17;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

/* ---------- Stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(to bottom,var(--sky1),var(--sky2));
  transition:--sky1 1.6s ease,--sky2 1.6s ease,--ground 1.6s ease}
#stage::after{content:"";position:absolute;inset:0;background:var(--dim);pointer-events:none;z-index:4}
#sun{position:absolute;width:11vmin;height:11vmin;border-radius:50%;right:12vw;top:16vh;
  background:radial-gradient(circle,#FFF6D8 0 45%,#FFD27A 46% 100%);box-shadow:0 0 60px 20px rgba(255,214,130,.45);transition:opacity 1.2s}
#clouds{position:absolute;inset:0 auto auto 0;height:45vh}
.cloud{position:absolute;height:5vmin;background:#FFFFFFD0;border-radius:99px}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:45%;aspect-ratio:1;left:14%;bottom:30%}
.cloud::after{width:32%;aspect-ratio:1;left:50%;bottom:35%}
#world{position:absolute;inset:0;display:flex}
.panel{position:relative;height:100%;flex:none;width:100vw}
.landmark{position:absolute;left:28%;bottom:calc(20vh - 2px);width:min(40vw,600px);z-index:1}
.landmark svg{display:block;width:100%;height:auto;overflow:visible}
.placetag{position:absolute;left:28%;bottom:calc(20vh + min(40vw,600px) * .67);z-index:1;
  font-family:var(--cine);font-weight:700;letter-spacing:.18em;font-size:clamp(.7rem,1.1vw,.9rem);color:#FFFFFFE6;text-shadow:0 1px 8px rgba(0,0,0,.35)}
#ground{position:absolute;left:0;right:0;bottom:0;height:20vh;background:var(--ground);z-index:2}
#ground::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:rgba(0,0,0,.08)}
#path{position:absolute;left:0;right:0;bottom:calc(var(--feet) - 2.2vh);height:5vh;background-color:rgba(255,240,215,.5);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 40px,transparent 40px 90px);
  background-size:90px 4px;background-repeat:repeat-x;background-position:0 50%}
#fx{position:absolute;inset:0;z-index:3;pointer-events:none;width:100%;height:100%}

/* ---------- Character ---------- */
#girl{position:absolute;left:var(--gl);bottom:var(--feet);height:var(--ch);z-index:5}
#girl .face{height:100%;transition:transform .25s}
#girl.back .face{transform:scaleX(-1)}
#girl svg{height:100%;width:auto;display:block;overflow:visible}
.limb{transform-box:fill-box;transform-origin:50% 4%}
.walking .legF,.walking .armB{animation:legA .55s ease-in-out infinite alternate}
.walking .legB,.walking .armF{animation:legB .55s ease-in-out infinite alternate}
.walking .bob{animation:bob .275s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes legB{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.waving .armF{animation:wave .7s ease-in-out 3 alternate;transform:rotate(-150deg)}
@keyframes wave{0%{transform:rotate(-135deg)}100%{transform:rotate(-170deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#bubble{position:absolute;left:calc(var(--gl) + var(--ch) * .28);bottom:calc(var(--feet) + var(--ch) + 14px);z-index:6;
  max-width:min(19rem,70vw);background:var(--card);color:var(--ink);padding:.75rem 1rem;border-radius:18px 18px 18px 4px;
  font-weight:600;font-size:1.05rem;line-height:1.35;box-shadow:0 10px 30px rgba(20,25,50,.2);
  opacity:0;transform:translateY(8px) scale(.96);transform-origin:0 100%;transition:opacity .3s,transform .3s}
#bubble.show{opacity:1;transform:none}

/* ---------- Card ---------- */
#card{position:absolute;z-index:7;right:5vw;top:calc(11vh + env(safe-area-inset-top,0px));width:min(31rem,40vw);max-height:66vh;overflow:auto;
  background:var(--card);color:var(--ink);border-radius:22px;padding:1.6rem 1.7rem;box-shadow:0 24px 70px rgba(10,15,40,.3);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;transform:translateY(18px) scale(.98);transition:opacity .5s,transform .5s;pointer-events:none}
#card.show{opacity:1;transform:none;pointer-events:auto}
.chap{font-family:var(--cine);font-weight:700;letter-spacing:.2em;font-size:.78rem;color:var(--gold);margin:0 0 .5rem}
#card .when{color:var(--muted);font-weight:600;margin:0 0 .2rem;font-size:.95rem}
#card h2{font-size:clamp(1.5rem,2.5vw,2.1rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 .3rem;font-weight:800}
#card .where{color:var(--muted);margin:0 0 1rem;font-weight:600}
#card p{margin:0 0 .8rem;line-height:1.55}
#card h3{font-size:1rem;margin:1rem 0 .3rem}
ul.points{margin:0 0 .8rem;padding:0;list-style:none}
ul.points li{position:relative;padding:0 0 .55rem 1.2rem;line-height:1.5}
ul.points li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
ul.items{list-style:none;padding:0;margin:.2rem 0 .6rem}
ul.items li{padding:.55rem 0;border-top:1px solid var(--line)}
ul.items li:first-child{border-top:0}
ul.items b{display:block}
ul.items span{color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:.3rem 0 .8rem}
.tags li{font-size:.85rem;padding:.2rem .65rem;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.badges{display:grid;gap:.5rem;margin:.6rem 0 .9rem}
.badge{border-left:4px solid var(--gold);padding:.15rem 0 .15rem .8rem;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.8rem;margin:.4rem 0 1rem}
.stats div{background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:14px;padding:.7rem .8rem}
.stats b{display:block;font-size:1.9rem;line-height:1;font-weight:800;color:var(--accent)}
.stats span{font-size:.85rem;color:var(--muted)}
.photo{margin:0 0 1.1rem;background:#fff;padding:.5rem .5rem .4rem;border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.18);transform:rotate(-1.2deg)}
.photo img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:2px}
.photo figcaption{color:#3A3F4E;font-size:.85rem;padding:.4rem .2rem 0;text-align:center}
.big-name{font-family:var(--cine);font-weight:900;letter-spacing:.04em;font-size:clamp(2rem,3.8vw,3rem)!important}
.hint{color:var(--muted);font-size:.92rem;margin-top:.4rem}
.btnrow{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0}
.btnrow a{display:inline-block;text-decoration:none;padding:.6rem 1rem;border-radius:99px;border:2px solid var(--accent)}
.btnrow a.primary{background:var(--accent);color:var(--accent-ink)}

/* ---------- HUD ---------- */
#progress{position:absolute;z-index:8;top:calc(1.2rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  display:flex;gap:.35rem;list-style:none;margin:0;padding:.45rem .6rem;border-radius:99px;background:var(--card);box-shadow:0 6px 20px rgba(20,25,50,.14)}
#progress button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--line);transition:background .3s,width .3s}
#progress button.on{background:var(--accent);width:28px;border-radius:99px}
#progress button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
#controls{position:absolute;z-index:8;right:5vw;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));display:flex;gap:.6rem}
#controls button{border:0;border-radius:99px;font-weight:700;box-shadow:0 8px 24px rgba(20,25,50,.22)}
#prev{width:3.2rem;height:3.2rem;background:var(--card);color:var(--ink);font-size:1.3rem}
#next{height:3.2rem;padding:0 1.5rem;background:var(--accent);color:var(--accent-ink);font-size:1.05rem}
#controls button:disabled{opacity:.4;cursor:default}
body.intro #progress,body.intro #controls,body.intro #card,body.intro #bubble{visibility:hidden}

/* ---------- Letterbox ---------- */
.bar{position:fixed;left:0;right:0;height:0;background:#000;z-index:40;transition:height .7s cubic-bezier(.6,0,.3,1)}
.bar.t{top:0}.bar.b{bottom:0}
body.cinema .bar{height:9vh}

/* ---------- Intro trailer ---------- */
#intro{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at center,#1A1F33 0%,#07090F 70%);color:#F4EFE4;
  display:grid;place-items:center;text-align:center;transition:opacity 1s}
#intro.gone{opacity:0;pointer-events:none}
#intro .tl{position:absolute;left:8vw;right:8vw;top:50%;transform:translateY(-50%) scale(.98);margin:0;
  font-family:var(--cine);font-weight:500;font-size:clamp(1.25rem,3.2vw,2.4rem);letter-spacing:.06em;line-height:1.35;
  opacity:0;filter:blur(6px);transition:opacity .9s,filter .9s,transform 2.6s ease-out}
#intro .tl.show{opacity:1;filter:blur(0);transform:translateY(-50%) scale(1.03)}
#title{opacity:0;transition:opacity 1.4s}
#title.show{opacity:1}
#title .pre{font-family:var(--cine);letter-spacing:.35em;font-size:clamp(.75rem,1.4vw,1rem);color:#E7B460;margin:0 0 1rem}
#title h1{font-family:var(--cine);font-weight:900;font-size:clamp(2.8rem,10vw,7.5rem);letter-spacing:.08em;margin:0;line-height:1;
  background:linear-gradient(180deg,#FFF6DD 0%,#E7B460 60%,#A8762A 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#title .sub{margin:1.1rem 0 2.2rem;font-size:clamp(1rem,1.8vw,1.25rem);color:#C9CBD6}
#begin{border:2px solid #E7B460;background:transparent;color:#F4EFE4;border-radius:99px;padding:.9rem 1.8rem;font-size:1.05rem;font-weight:700;letter-spacing:.04em}
#begin:hover{background:#E7B460;color:#0B0E17}
#skip{position:absolute;right:1.2rem;bottom:calc(10vh + 1rem + env(safe-area-inset-bottom,0px));z-index:2;background:transparent;border:1px solid #ffffff44;color:#C9CBD6;border-radius:99px;padding:.5rem 1rem}

/* ---------- Flight transition ---------- */
#flight{position:fixed;inset:0;z-index:25;opacity:0;pointer-events:none;transition:opacity .6s;
  background:radial-gradient(1.5px 1.5px at 12% 20%,#fff9,transparent),radial-gradient(1px 1px at 30% 70%,#fff8,transparent),
  radial-gradient(1.5px 1.5px at 55% 15%,#fffa,transparent),radial-gradient(1px 1px at 78% 40%,#fff8,transparent),
  radial-gradient(1.5px 1.5px at 90% 80%,#fff9,transparent),radial-gradient(1px 1px at 45% 55%,#fff7,transparent),
  radial-gradient(ellipse at 50% 120%,#24305A 0%,#0A0E1C 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#F4EFE4;text-align:center}
#flight.show{opacity:1}
#flight .fch{font-family:var(--cine);letter-spacing:.3em;color:#E7B460;font-weight:700;margin:0 0 .6rem;font-size:clamp(.8rem,1.4vw,1rem)}
#flight h2{font-family:var(--cine);font-weight:900;font-size:clamp(2rem,6vw,4.4rem);letter-spacing:.06em;margin:0}
#flight .fyear{color:#C9CBD6;margin:.5rem 0 0;font-size:clamp(.95rem,1.5vw,1.15rem)}
#flight svg{width:min(92vw,1000px);height:auto;margin-top:2vh}
#flight text{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:20px;fill:#DDE2F0;font-weight:600}
.pulse{animation:pulse 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(2.4);opacity:0}}

/* ---------- Scenery motion ---------- */
.blinky{animation:led 1.2s steps(1) infinite}.blinky.d2{animation-delay:.4s}.blinky.d3{animation-delay:.8s}
@keyframes led{50%{opacity:.25}}
.drawline{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 3s ease-out .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bobboat{animation:boat 3s ease-in-out infinite alternate}
@keyframes boat{from{transform:translateY(0)}to{transform:translateY(3px)}}

@media (max-width:760px){
  :root{--ch:clamp(130px,22vh,180px);--feet:11vh;--gl:6vw}
  #bubble{font-size:.95rem}
  #card{left:.9rem;right:.9rem;width:auto;top:calc(3.6rem + env(safe-area-inset-top,0px));max-height:46vh;padding:1.2rem 1.25rem;border-radius:18px}
  .landmark{left:36%;width:66vw}
  .placetag{display:none}
  #controls{right:.9rem;bottom:calc(2.5vh + env(safe-area-inset-bottom,0px))}
  #sun{right:8vw;top:auto;bottom:52vh}
  body.cinema .bar{height:6vh}
}
@media (prefers-reduced-motion:reduce){
  #stage,#intro .tl{transition:none!important}
  .walking *,.waving *,.eye,.blinky,.sway,.bobboat,.pulse{animation:none!important}
  .drawline{animation:none;stroke-dashoffset:0}
}
</style>
</head>

<div id="intro">
  <p class="tl">Every journey begins with a single step.</p>
  <p class="tl">From the backwaters of Kerala…</p>
  <p class="tl">…to the deserts of Qatar…</p>
  <p class="tl">…to the highlands of Scotland…</p>
  <p class="tl">…and into the world of FinTech.</p>
  <div id="title">
    <p class="pre">A JOURNEY IN CODE AND DATA</p>

<script>
/* ================= Scenery (hand-drawn landmarks) ================= */
const svg = inner => `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const palm = (x, s = 1, f = 1) => `<g transform="translate(${x} 260) scale(${s * f} ${s})"><g class="sway">
  <path d="M0 0 C 4 -40, -6 -90, 10 -140" stroke="#7A5230" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g transform="translate(10 -140)" fill="#2E8B57">
    <path d="M0 0 C 20 -20, 50 -15, 72 6 C 45 -5, 20 -5, 0 0Z"/><path d="M0 0 C -20 -20, -50 -15, -72 6 C -45 -5, -20 -5, 0 0Z"/>
    <path d="M0 0 C 10 -25, 35 -40, 62 -34 C 35 -30, 15 -15, 0 0Z" fill="#3BA16A"/><path d="M0 0 C -10 -25, -35 -40, -62 -34 C -35 -30, -15 -15, 0 0Z" fill="#3BA16A"/>

/* ================= Engine ================= */
const N = SCENES.length;
const $ = id => document.getElementById(id);
const stage = $("stage"), world = $("world"), clouds = $("clouds"), path = $("path");
const girl = $("girl"), bubble = $("bubble"), card = $("card"), next = $("next"), prev = $("prev"), progress = $("progress");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE = "cubic-bezier(.45,.05,.4,1)";

world.style.width = `${N * 100}vw`;
world.innerHTML = SCENES.map(s => `<div class="panel"><div class="placetag">${s.tag}</div><div class="landmark">${LAND[s.land]}</div></div>`).join("");
clouds.style.width = `${N * 30 + 120}vw`;
clouds.innerHTML = Array.from({ length: N * 2 + 4 }, (_, i) =>
  `<div class="cloud" style="left:${i * 17 + ((i * 13) % 9)}vw;top:${6 + ((i * 29) % 26)}vh;width:${8 + ((i * 37) % 9)}vmin;opacity:${0.55 + ((i * 7) % 4) / 10}"></div>`).join("");
progress.innerHTML = SCENES.map((s, i) => `<li><button aria-label="Go to ${s.label}" title="${s.label}" data-i="${i}"></button></li>`).join("");

function setWorld(i, d) {
  const t = d ? `${d}ms ${EASE}` : "none";
  world.style.transition = d ? `transform ${t}` : "none";
  clouds.style.transition = d ? `transform ${t}` : "none";
  path.style.transition = d ? `background-position ${t}` : "none";
  world.style.transform = `translateX(${-i * 100}vw)`;
  clouds.style.transform = `translateX(${-i * 18}vw)`;
  path.style.backgroundPosition = `${-i * 100}vw 50%`;
}
function setSky(i, d) {
  stage.style.transition = `--sky1 ${d}ms ease, --sky2 ${d}ms ease, --ground ${d}ms ease`;
  stage.style.setProperty("--sky1", SCENES[i].sky[0]);
  stage.style.setProperty("--sky2", SCENES[i].sky[1]);
  stage.style.setProperty("--ground", SCENES[i].ground);
  $("sun").style.opacity = SCENES[i].region === "scotland" ? .35 : 1;
}

/* Ambient particles: fireflies, desert dust, Scottish rain, city sparkle */
const fx = $("fx"), ctx = fx.getContext("2d");
let parts = [], fxType = "fireflies", W = 0, H = 0;
function sizeFx() { const r = devicePixelRatio || 1; W = innerWidth; H = innerHeight; fx.width = W * r; fx.height = H * r; ctx.setTransform(r, 0, 0, r, 0, 0); }
function particle() {
  const R = Math.random;
  if (fxType === "rain") return { x: R() * W * 1.2, y: R() * H, vx: -1.2, vy: 7 + R() * 4, l: 8 + R() * 8 };
  if (fxType === "dust") return { x: R() * W, y: H * (.4 + R() * .55), vx: .5 + R(), vy: (R() - .5) * .2, r: .8 + R() * 1.6 };
  if (fxType === "sparkle") return { x: R() * W, y: R() * H * .55, p: R() * 6, r: .8 + R() * 1.4 };
  return { x: R() * W, y: H * (.3 + R() * .55), vx: (R() - .5) * .4, vy: (R() - .5) * .3, p: R() * 6, r: 1.4 + R() * 1.8 };
}
function setFx(type) { fxType = type; parts = Array.from({ length: type === "rain" ? 110 : 45 }, particle); }
function loop() {
  ctx.clearRect(0, 0, W, H);
  for (const q of parts) {
    if (fxType === "rain") {
      q.x += q.vx; q.y += q.vy; if (q.y > H) { q.y = -20; q.x = Math.random() * W * 1.2; }
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + q.vx * 2, q.y + q.l); ctx.stroke();
    } else if (fxType === "dust") {
      q.x += q.vx; q.y += q.vy; if (q.x > W) q.x = -5;
      ctx.fillStyle = "rgba(255,236,200,.55)"; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    } else {
      q.p += .03; if (q.vx) { q.x += q.vx; q.y += q.vy; if (q.x < 0 || q.x > W) q.vx *= -1; if (q.y < H * .25 || q.y > H * .9) q.vy *= -1; }
      const a = (Math.sin(q.p) + 1) / 2;
      ctx.fillStyle = fxType === "sparkle" ? `rgba(255,255,255,${a * .8})` : `rgba(255,224,120,${.25 + a * .7})`;
      ctx.shadowColor = "rgba(255,220,120,.9)"; ctx.shadowBlur = fxType === "sparkle" ? 4 : 10;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  requestAnimationFrame(loop);
}
sizeFx(); addEventListener("resize", sizeFx);

/* Speech bubble typing */
let typer;
function say(text) {
  clearInterval(typer); bubble.textContent = ""; bubble.classList.add("show");
  if (reduce) { bubble.textContent = text; return; }
  const ch = Array.from(text); let k = 0;
  typer = setInterval(() => { bubble.textContent += ch[k++]; if (k >= ch.length) clearInterval(typer); }, 30);
}
function countUp() {
  card.querySelectorAll("[data-count]").forEach(el => {
    const end = +el.dataset.count, dec = +el.dataset.dec, suf = el.dataset.suffix || "";
    if (reduce) { el.textContent = end.toFixed(dec) + suf; return; }
    const t0 = performance.now();
    const tick = now => { const p = Math.min(1, (now - t0) / 1300), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (end * e).toFixed(dec) + suf; if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

let cur = 0, busy = false;
function arrive(i) {
  const s = SCENES[i];
  document.body.classList.remove("cinema");
  card.innerHTML = s.html; card.scrollTop = 0; card.classList.add("show");
  countUp(); say(s.say);
  girl.classList.remove("back");
  if (s.wave && !reduce) { girl.classList.add("waving"); setTimeout(() => girl.classList.remove("waving"), 2200); }
  [...progress.querySelectorAll("button")].forEach((b, j) => {
    b.classList.toggle("on", j === i); b.classList.toggle("done", j < i);
    b.setAttribute("aria-current", j === i ? "step" : "false");
  });
  prev.disabled = i === 0;
  next.textContent = i === 0 ? "Walk with me" : i === N - 1 ? "Watch again" : "Next chapter";
}
function leave(target) {
  busy = true;
  card.classList.remove("show"); bubble.classList.remove("show");
  girl.classList.remove("waving");
  girl.classList.toggle("back", target < cur);
}

function walk(target) {
  leave(target);
  const steps = Math.abs(target - cur);
  const d = reduce ? 0 : Math.min(1500 + (steps - 1) * 450, 3600);
  if (d) { girl.classList.add("walking"); if (steps > 1) document.body.classList.add("cinema"); }
  setWorld(target, d); setSky(target, d);
  setTimeout(() => { girl.classList.remove("walking"); cur = target; arrive(cur); busy = false; }, d + 60);
}

function fly(target) {
  leave(target);
  const from = REGIONS[SCENES[cur].region].name, to = REGIONS[SCENES[target].region].name;
  const s = SCENES[target];
  $("fch").textContent = s.chapter || "";
  $("fplace").textContent = s.place || to;
  $("fyear").textContent = s.year || "";
  $("fromT").textContent = from; $("toT").textContent = to;
  const fl = $("flight"), arc = $("arcTrail"), plane = $("plane"), len = arc.getTotalLength();
  arc.style.strokeDasharray = len; arc.style.strokeDashoffset = len;
  document.body.classList.add("cinema");
  fl.classList.add("show");
  if (reduce) {
    setWorld(target, 0); setSky(target, 0); setFx(REGIONS[s.region].fx);
    setTimeout(() => { fl.classList.remove("show"); cur = target; arrive(cur); busy = false; }, 1400);
    return;
  }
  const T = 2600, t0 = performance.now() + 500;
  const step = now => {
    const p = Math.max(0, Math.min(1, (now - t0) / T)), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const a = arc.getPointAtLength(e * len), b = arc.getPointAtLength(Math.min(len, e * len + 1));
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    plane.setAttribute("transform", `translate(${a.x} ${a.y}) rotate(${ang})`);
    arc.style.strokeDashoffset = len * (1 - e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  setTimeout(() => {
    setWorld(target, 0); setSky(target, 0); setFx(REGIONS[s.region].fx);
    girl.style.transition = "none"; girl.style.transform = "translateX(-45vw)";
  }, 900);
  setTimeout(() => {
    fl.classList.remove("show");
    girl.classList.remove("back"); girl.classList.add("walking");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      girl.style.transition = "transform 1.7s cubic-bezier(.3,.1,.3,1)"; girl.style.transform = "translateX(0)";
    }));
    setTimeout(() => { girl.classList.remove("walking"); cur = target; arrive(cur); busy = false; }, 1800);
  }, T + 1100);
}

function go(target) {
  if (busy) return;
  if (target >= N) target = 0;
  if (target < 0 || target === cur) return;
  SCENES[target].region !== SCENES[cur].region ? fly(target) : walk(target);
}

next.addEventListener("click", () => go(cur + 1));
prev.addEventListener("click", () => go(cur - 1));
progress.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
addEventListener("keydown", e => {
  if (document.body.classList.contains("intro")) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startJourney(); } return; }
  if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
});
let acc = 0, wt;
addEventListener("wheel", e => {
  if (document.body.classList.contains("intro")) return;
  if (e.target.closest && e.target.closest("#card")) {
    const top = card.scrollTop <= 0, bottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 2;
    if ((e.deltaY > 0 && !bottom) || (e.deltaY < 0 && !top)) return;
  }
  acc += e.deltaY + e.deltaX; clearTimeout(wt); wt = setTimeout(() => acc = 0, 220);
  if (acc > 70) { acc = 0; if (cur < N - 1) go(cur + 1); }
  if (acc < -70) { acc = 0; go(cur - 1); }
}, { passive: true });
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (document.body.classList.contains("intro")) return;
  if (e.target.closest && e.target.closest("#card, a, button")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 45) return;
  (Math.abs(dx) > Math.abs(dy) ? dx < 0 : dy < 0) ? (cur < N - 1 && go(cur + 1)) : go(cur - 1);
}, { passive: true });

/* ================= Trailer intro ================= */
setWorld(0, 0); setSky(0, 0); setFx("fireflies");
if (!reduce) loop();
girl.style.transform = "translateX(-45vw)";
const lines = [...document.querySelectorAll("#intro .tl")];
const timers = [];
let started = false;
if (reduce) {
  $("title").classList.add("show");
} else {
  lines.forEach((l, i) => {
    timers.push(setTimeout(() => l.classList.add("show"), 600 + i * 2300));
    timers.push(setTimeout(() => l.classList.remove("show"), 600 + i * 2300 + 1800));
  });
  timers.push(setTimeout(() => $("title").classList.add("show"), 600 + lines.length * 2300 + 200));
}
function startJourney() {
  if (started) return; started = true;
  timers.forEach(clearTimeout);
  $("intro").classList.add("gone");
  document.body.classList.remove("intro");
  busy = true;
  if (reduce) { girl.style.transform = "none"; arrive(0); busy = false; return; }
  setTimeout(() => {
    girl.classList.add("walking");
    girl.style.transition = "transform 1.9s cubic-bezier(.3,.1,.3,1)"; girl.style.transform = "translateX(0)";
    setTimeout(() => { girl.classList.remove("walking"); arrive(0); busy = false; }, 2000);
  }, 700);
}
$("begin").addEventListener("click", startJourney);
$("skip").addEventListener("click", startJourney);
</script>
