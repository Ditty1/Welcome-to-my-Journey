<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditty Denny | My Journey</title>
<meta name="description" content="Ditty Denny, Software Engineer in FinTech. A cinematic journey through Thrissur, Doha, Stirling and Dubai.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(14,16,22,.52); --glass-line:rgba(255,255,255,.14); --ink:#F5F1EA; --muted:rgba(245,241,234,.72); --gold:#D9B26F; --chip:rgba(255,255,255,.1);
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){ --glass:rgba(250,248,244,.74); --glass-line:rgba(0,0,0,.08); --ink:#1B1A18; --muted:rgba(27,26,24,.7); --gold:#9A7330; --chip:rgba(0,0,0,.06); color-scheme:light }
}
:root[data-theme="light"]{ --glass:rgba(250,248,244,.74); --glass-line:rgba(0,0,0,.08); --ink:#1B1A18; --muted:rgba(27,26,24,.7); --gold:#9A7330; --chip:rgba(0,0,0,.06); color-scheme:light }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#0A0B0F;color:#F5F1EA;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

/* ---------- Cinematic plates ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#0A0B0F}
.plate{position:absolute;inset:0;opacity:0;will-change:transform,opacity,filter}
.plate .move{position:absolute;inset:-4%;will-change:transform}
.plate .soft,.plate .sharp{position:absolute;inset:0;background-size:cover;background-position:center}
.plate .soft{filter:blur(14px) saturate(1.05) brightness(.9);transform:scale(1.05)}
.plate .sharp{-webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 42%,#000 42%,transparent 88%);mask-image:radial-gradient(ellipse 62% 58% at 50% 42%,#000 42%,transparent 88%);
  filter:saturate(1.06) contrast(1.04)}
.plate.fallback .soft,.plate.fallback .sharp{background:radial-gradient(ellipse at 60% 30%,#3A3550,#12131A 70%)}
#light{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 18% 8%,rgba(255,214,160,.22),transparent 60%),
             linear-gradient(to top,rgba(5,6,10,.86) 0%,rgba(5,6,10,.35) 34%,rgba(5,6,10,0) 55%),
             linear-gradient(to bottom,rgba(5,6,10,.45),rgba(5,6,10,0) 22%),
             radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.45) 100%)}
#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.045;mix-blend-mode:overlay;image-rendering:pixelated}
#sweep{position:fixed;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 30%,rgba(255,236,200,.18) 48%,transparent 66%)}

/* ---------- Top bar ---------- */
#top{position:fixed;z-index:20;top:calc(1.4rem + env(safe-area-inset-top,0px));left:clamp(1.2rem,4vw,3.5rem);right:clamp(1.2rem,4vw,3.5rem);
  display:flex;justify-content:space-between;align-items:center;opacity:0;transition:opacity 1s}
body.on #top{opacity:1}
#brand{font-family:var(--serif);font-size:1.35rem;letter-spacing:.02em}
#voice{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:.45rem .95rem;font-size:.85rem;font-weight:600;color:#F5F1EA;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:rgba(6,7,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity 1s var(--ease)}
#splash.gone{opacity:0;pointer-events:none}
#splash h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,7vw,5.2rem);margin:0;letter-spacing:.01em;line-height:1}
#splash p{color:rgba(245,241,234,.75);margin:.9rem 0 2rem;font-size:1.05rem}
#enter{background:#F5F1EA;color:#121317;border:0;border-radius:99px;padding:.95rem 2rem;font-weight:700;font-size:1rem}
#quiet{display:block;margin:1rem auto 0;background:none;border:0;color:rgba(245,241,234,.65);text-decoration:underline;text-underline-offset:3px;font-size:.92rem}

/* ---------- Ditty ---------- */
#ditty{position:fixed;z-index:6;right:clamp(0rem,6vw,7rem);bottom:0;height:min(86vh,900px);aspect-ratio:3/4;pointer-events:none;
  opacity:0;transform:translateX(9vw) scale(.98);filter:blur(10px);transition:opacity 1.5s var(--ease),transform 1.8s var(--ease),filter 1.5s var(--ease)}
#ditty.in{opacity:1;transform:none;filter:none}
#ditty.out{opacity:0;transform:translateX(-4vw) scale(.97);filter:blur(8px);transition-duration:.7s}
#ditty img,#ditty video,#ditty svg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.55))}
#ditty .rim{position:absolute;inset:10% 5% 0;background:radial-gradient(ellipse at 50% 40%,rgba(255,220,170,.22),transparent 65%);filter:blur(30px)}

#ditty svg{animation:dfloat 6s ease-in-out infinite alternate}
@keyframes dfloat{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.dopen{transform-box:fill-box;transform-origin:center;transform:scaleY(.05)}
body.speaking .dopen{animation:dtalk .2s ease-in-out infinite alternate}
body.speaking .dlow{animation:dlow .2s ease-in-out infinite alternate}
@keyframes dtalk{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes dlow{from{transform:translateY(0)}to{transform:translateY(2.2px)}}
.deyes{transform-box:fill-box;transform-origin:center;animation:dblink 5s infinite}
@keyframes dblink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
#face svg{width:100%;height:100%;background:#2A2733}
@media (prefers-reduced-motion:reduce){#ditty svg,.deyes,body.speaking .dopen,body.speaking .dlow{animation:none}}

/* ---------- Intro text ---------- */
#hello{position:fixed;z-index:11;left:clamp(1.2rem,6vw,6rem);bottom:calc(14vh + env(safe-area-inset-bottom,0px));max-width:min(34rem,48vw)}
#hello > *{opacity:0;transform:translateY(16px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
#hello.in > *{opacity:1;transform:none}
#hello.in > :nth-child(2){transition-delay:.15s}#hello.in > :nth-child(3){transition-delay:.3s}#hello.in > :nth-child(4){transition-delay:.45s}#hello.in > :nth-child(5){transition-delay:.6s}
#hello.out > *{opacity:0;transform:translateY(-10px);transition-duration:.5s;transition-delay:0s}
.kicker{color:var(--gold);font-weight:600;letter-spacing:.04em;margin:0 0 .6rem}
#hello h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.8rem,6vw,5rem);line-height:.98;margin:0 0 .9rem;color:#F5F1EA}
#hello .role{font-size:1.15rem;font-weight:600;margin:0 0 .9rem;color:#F5F1EA}
#hello .bio{color:rgba(245,241,234,.8);line-height:1.6;margin:0 0 1.6rem;font-size:1.02rem}
.cta{display:inline-flex;align-items:center;gap:.6rem;background:#F5F1EA;color:#121317;border:0;border-radius:99px;padding:.9rem 1.6rem;font-weight:700}
.cta span{font-size:1.15rem;line-height:1}

/* ---------- Journey caption + panel ---------- */
#caption{position:fixed;z-index:7;left:clamp(1.2rem,5vw,5rem);bottom:calc(17vh + env(safe-area-inset-bottom,0px));max-width:min(40rem,52vw);pointer-events:none}
#caption .chap{color:var(--gold);font-weight:600;letter-spacing:.04em;margin:0 0 .5rem}
#caption h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,6.4vw,5.6rem);line-height:.95;margin:0;color:#F5F1EA;text-shadow:0 4px 40px rgba(0,0,0,.45)}
#caption .year{color:rgba(245,241,234,.8);margin:.7rem 0 0;font-size:1.05rem}
#caption > *{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
#caption.in > *{opacity:1;transform:none}
#caption.in h2{transition-delay:.12s}#caption.in .year{transition-delay:.24s}

#panel{position:fixed;z-index:8;right:clamp(1.2rem,4vw,3.5rem);top:50%;transform:translateY(-50%) translateX(20px);width:min(26rem,34vw);max-height:68vh;overflow:auto;
  background:var(--glass);color:var(--ink);border:1px solid var(--glass-line);border-radius:20px;padding:1.5rem 1.6rem;
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.35);
  opacity:0;transition:opacity .7s var(--ease),transform .9s var(--ease);pointer-events:none}
#panel.in{opacity:1;transform:translateY(-50%);pointer-events:auto}
#panel .when{color:var(--muted);font-size:.9rem;margin:0 0 .3rem}
#panel h3{font-size:1.3rem;margin:0 0 .15rem;line-height:1.25}
#panel .org{color:var(--muted);margin:0 0 1rem;font-weight:500}
#panel ul.pts{list-style:none;padding:0;margin:0 0 1rem}
#panel ul.pts li{position:relative;padding:0 0 .6rem 1.1rem;line-height:1.5;font-size:.95rem}
#panel ul.pts li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:.2rem 0 .4rem}
.chips li{font-size:.8rem;padding:.25rem .65rem;border-radius:99px;background:var(--chip)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:0 0 1rem}
.stats div{border:1px solid var(--glass-line);border-radius:14px;padding:.7rem .8rem}
.stats b{display:block;font-family:var(--serif);font-size:2rem;line-height:1;font-weight:600;color:var(--gold)}
.stats span{font-size:.8rem;color:var(--muted)}
.honor{border-left:2px solid var(--gold);padding:.1rem 0 .1rem .8rem;margin:0 0 .6rem;font-weight:600;font-size:.95rem}
#panel .links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
#panel .links a{text-decoration:none;font-weight:600;font-size:.9rem;padding:.55rem .95rem;border-radius:99px;border:1px solid var(--glass-line)}
#panel .links a.solid{background:var(--gold);color:#16130C;border-color:transparent}
#panel p{line-height:1.55;font-size:.95rem;margin:0 0 .8rem}
#panel h4{font-size:.85rem;color:var(--muted);font-weight:600;margin:.8rem 0 .3rem}

/* ---------- Narrator ---------- */
#narrator{position:fixed;z-index:9;left:50%;bottom:calc(5.6rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:.8rem;max-width:min(44rem,92vw);opacity:0;transition:opacity .5s;pointer-events:none}
#narrator.show{opacity:1}
#face{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:#2A2733;border:2px solid rgba(255,255,255,.7);position:relative}
#face img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#face::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold);opacity:0}
#narrator.talking #face::after{animation:ring 1.4s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}
#line{color:#fff;font-size:clamp(.95rem,1.5vw,1.12rem);line-height:1.4;font-weight:500;text-shadow:0 2px 14px rgba(0,0,0,.8)}

/* ---------- Timeline ---------- */
#timeline{position:fixed;z-index:10;left:clamp(1.2rem,4vw,3.5rem);right:clamp(1.2rem,4vw,3.5rem);bottom:calc(1.3rem + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:1rem;opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s;pointer-events:none}
body.journey #timeline{opacity:1;transform:none;pointer-events:auto}
#steps{flex:1;display:flex;list-style:none;margin:0;padding:0;gap:.25rem;overflow-x:auto;scrollbar-width:none}
#steps::-webkit-scrollbar{display:none}
#steps button{background:none;border:0;padding:.55rem .2rem .3rem;min-width:4.8rem;text-align:left;color:rgba(245,241,234,.5);font-size:.78rem;font-weight:600;border-top:2px solid rgba(255,255,255,.18);transition:color .4s,border-color .4s;white-space:nowrap}
#steps button.on{color:#F5F1EA;border-color:var(--gold)}
#steps button.done{border-color:rgba(217,178,111,.5);color:rgba(245,241,234,.7)}
.arrow{flex:none;width:2.9rem;height:2.9rem;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);font-size:1.2rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.arrow.next{background:#F5F1EA;color:#121317;border-color:transparent}
.arrow:disabled{opacity:.35;cursor:default}
#credit{position:fixed;z-index:10;right:clamp(1.2rem,4vw,3.5rem);top:calc(4.2rem + env(safe-area-inset-top,0px));font-size:.72rem;color:rgba(245,241,234,.55);text-decoration:none;opacity:0;transition:opacity .6s}
body.journey #credit.has{opacity:1}

@media (max-width:820px){
  #ditty{right:auto;left:50%;margin-left:-16.5vh;top:calc(7.2rem + env(safe-area-inset-top,0px));bottom:auto;height:44vh;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);mask-image:linear-gradient(to bottom,#000 72%,transparent)}
  #hello{left:1.2rem;right:1.2rem;max-width:none;bottom:calc(7rem + env(safe-area-inset-bottom,0px))}
  #hello h2{font-size:2.6rem}
  #hello .bio{font-size:.95rem}
  #hello{bottom:calc(1.6rem + env(safe-area-inset-bottom,0px))}
  #hello h2{font-size:2.3rem}
  #caption{left:1.2rem;right:1.2rem;max-width:none;top:calc(4.6rem + env(safe-area-inset-top,0px));bottom:auto}
  #caption h2{font-size:2.5rem}
  #panel{left:1rem;right:1rem;width:auto;top:auto;bottom:calc(9.6rem + env(safe-area-inset-bottom,0px));max-height:38vh;transform:translateY(20px);padding:1.1rem 1.2rem}
  #panel.in{transform:none}
  #narrator{top:calc(4.6rem + env(safe-area-inset-top,0px));bottom:auto;width:calc(100vw - 2.4rem)}
  body.journey #narrator{top:calc(12.2rem + env(safe-area-inset-top,0px));bottom:auto}
  #steps button{min-width:4.2rem}
}
@media (prefers-reduced-motion:reduce){
  #ditty,#hello > *,#caption > *,#panel{transition-duration:.01s!important}
  #narrator.talking #face::after{animation:none}
}
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<div id="light" aria-hidden="true"></div>
<div id="sweep" aria-hidden="true"></div>
<canvas id="grain" width="160" height="90" aria-hidden="true"></canvas>

<div id="top"><div id="brand">Ditty Denny</div><button id="voice" aria-pressed="true">Sound on</button></div>

<div id="ditty" aria-hidden="true"><div class="rim"></div></div>

<section id="hello" aria-label="Introduction">
  <p class="kicker">Hello, welcome</p>
  <h2>I’m Ditty Denny</h2>
  <p class="role">Software Engineer in FinTech</p>
  <p class="bio">I make financial data clean, test ideas with models, and build the reporting that teams actually act on. Let me show you where I’ve been.</p>
  <button class="cta" id="begin">Begin my journey <span>→</span></button>
</section>

<div id="caption" aria-live="polite"><p class="chap"></p><h2></h2><p class="year"></p></div>
<aside id="panel" aria-live="polite"></aside>

<div id="narrator" aria-live="polite"><div id="face"></div><div id="line"></div></div>

<nav id="timeline" aria-label="Journey">
  <button class="arrow" id="prev" aria-label="Previous place">←</button>
  <ol id="steps"></ol>
  <button class="arrow next" id="next" aria-label="Next place">→</button>
</nav>
<a id="credit" target="_blank" rel="noopener"></a>

<div id="splash">
  <div>
    <h1>Ditty Denny</h1>
    <p>A journey in code, data and FinTech</p>
    <button id="enter">Enter with sound</button>
    <button id="quiet">Enter without sound</button>
  </div>
</div>

<script>
/* =================================================================
   CONTENT. Edit freely.
   Photos: put your own in an "images" folder to replace any city photo
   (images/thrissur.jpg, images/doha.jpg ...). Your portrait goes in
   images/ditty.png (transparent background works best).
   ================================================================= */
const LINKS = {
  email: "dittydenny2002@gmail.com",
  linkedin: "https://linkedin.com/in/ditty-denny123",
  github: "https://github.com/Ditty1",
  repo: "https://github.com/Ditty1/Data-Science-Portfolio"
};
const chips = a => `<ul class="chips">${a.map(t => `<li>${t}</li>`).join("")}</ul>`;
const pts = a => `<ul class="pts">${a.map(t => `<li>${t}</li>`).join("")}</ul>`;

const INTRO = {
  key: "home", wiki: ["Kerala_backwaters", "Vembanad_Lake"], drift: [0, -1],
  talk: "Hi! I’m Ditty Denny. I’m a software engineer in FinTech, and I love turning messy data into clear decisions. Come, let me show you my journey."
};

const SCENES = [
  { key: "thrissur", wiki: ["Thrissur_Pooram", "Vadakkunnathan_Temple"], step: "Thrissur", drift: [-1, 0],
    chap: "Where it began", place: "Thrissur", year: "Kerala, 2020 to 2023",
    talk: "This is Thrissur, my home. The city of temples, elephants and Pooram. Here I studied Data Science, and graduated with ninety six point eight out of a hundred.",
    html: `<p class="when">2020 to 2023</p><h3>BVoc Data Science</h3><p class="org">St. Thomas College, Calicut University</p>
      <div class="stats"><div><b>96.8</b><span>out of 100</span></div><div><b>1st</b><span>Class with Distinction</span></div></div>
      ${chips(["Python", "Statistics", "Databases", "Machine learning", "Operations research"])}` },

  { key: "kochi", wiki: ["Chinese_fishing_nets", "Fort_Kochi"], step: "First steps", drift: [1, 0],
    chap: "First steps", place: "Kerala Coast", year: "2022 to 2023",
    talk: "My first taste of real world data. As a quantitative analyst intern at XTG Technologies, I found trends and built insights for decisions.",
    html: `<p class="when">Dec 2022 to Jul 2023</p><h3>Quantitative Analyst Intern</h3><p class="org">XTG Technologies, Kerala</p>
      ${pts(["Data analysis, trend identification and performance evaluation with analytical models.", "Visualisations and insight summaries for data-driven decisions."])}
      <p>Also Data Science Intern at Elamigo, Dec 2022 to Feb 2023.</p>` },

  { key: "infopark", wiki: ["Infopark,_Kochi", "Marine_Drive,_Kochi"], step: "Data Engineer", drift: [0, 1],
    chap: "Building the pipes", place: "Kochi", year: "2023 to 2024",
    talk: "Then I learned to build the pipes that data flows through. As a data engineer, I designed ETL pipelines and owned data quality.",
    html: `<p class="when">Jul 2023 to Jan 2024</p><h3>Data Engineer</h3><p class="org">The Maya Solutions, India</p>
      ${pts(["Designed and maintained ETL pipelines feeding KPI dashboards and management reporting.", "Owned data quality, completeness and consistency across large real-world datasets."])}
      ${chips(["ETL", "SQL", "Data quality", "KPI dashboards"])}` },

  { key: "doha", wiki: ["West_Bay,_Doha", "Museum_of_Islamic_Art,_Doha", "Doha_Corniche"], step: "Doha", drift: [-1, 0],
    chap: "Across the sea", place: "Doha", year: "Qatar, 2024",
    talk: "Welcome to Doha, my first time working abroad. At Hamad Medical Corporation, I analysed operations across one of the region’s largest hospital networks.",
    html: `<p class="when">Jan 2024 to Jul 2024</p><h3>Video Analytical Operator</h3><p class="org">Hamad Medical Corporation, Qatar</p>
      ${pts(["Operational and service-impact analysis within one of the Middle East’s largest hospital networks.", "Insight summaries and performance observations used by management for decisions."])}` },

  { key: "stirling", wiki: ["National_Wallace_Monument", "Stirling_Castle"], step: "Stirling", drift: [1, -1],
    chap: "The highlands", place: "Stirling", year: "Scotland, 2024 to 2025",
    talk: "Then I crossed continents to Scotland, as a Commonwealth Shared Scholar, and finished my master’s in Data Science for Business with a Distinction.",
    html: `<p class="when">2024 to 2025</p><h3>MSc Data Science for Business</h3><p class="org">University of Stirling</p>
      <p class="honor">Distinction, the highest classification</p>
      <p class="honor">Commonwealth Shared Scholar</p>
      ${chips(["Machine learning", "Statistical modelling", "Database management", "Business analytics", "Data visualisation"])}` },

  { key: "falkirk", wiki: ["Falkirk_Wheel"], step: "Falkirk", drift: [-1, 0],
    chap: "Into the markets", place: "Falkirk", year: "Scotland, 2025",
    talk: "In Falkirk, at AiM, I designed and backtested trading strategies in Python. That work grew into my dissertation.",
    html: `<p class="when">Jul 2025 to Sep 2025</p><h3>Data Science Intern</h3><p class="org">AiM (Action Insight Management) Ltd</p>
      ${pts(["Designed and backtested moving-average trading strategies on daily equity data, benchmarked against buy-and-hold.", "Optimised parameters and ranked variants by cumulative return."])}` },

  { key: "award", wiki: ["Stirling_Castle", "Stirling"], step: "Dean’s Award", drift: [0, -1],
    chap: "The proudest moment", place: "The Dean’s Award", year: "University of Stirling, 2025",
    talk: "And this is the moment I’m most proud of. My dissertation, a financial market predictive tool, won the Dean’s Award for Excellence.",

const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, ms));
const stage = $("stage");

/* --- photo resolution: your own image first, then Wikipedia's photo of the place --- */
function loads(src, ms = 9000) {
  return new Promise(res => { const im = new Image(); const t = setTimeout(() => res(false), ms);
    im.onload = () => { clearTimeout(t); res(im.naturalWidth > 200); }; im.onerror = () => { clearTimeout(t); res(false); }; im.src = src; });
}
async function resolvePhoto(s) {
  for (const ext of ["jpg", "jpeg", "png", "webp"]) { const p = `images/${s.key}.${ext}`; if (await loads(p, 3000)) return { src: p }; }
  for (const t of s.wiki) {
    try {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${t}`);
      if (!r.ok) continue;
      const j = await r.json(), o = j.originalimage;
      if (!o || /\.svg/i.test(o.source) || o.width < 900) continue;
      let src = o.source;
      if (o.width > 2400 && j.thumbnail) src = j.thumbnail.source.replace(/\/\d+px-/, "/2200px-");
      if (await loads(src)) return { src, credit: `Photo: ${j.title}, Wikipedia`, href: j.content_urls && j.content_urls.desktop.page };
    } catch (e) {}
  }
  return null;
}
const photoCache = new Map();
const getPhoto = s => { if (!photoCache.has(s.key)) photoCache.set(s.key, resolvePhoto(s)); return photoCache.get(s.key); };

/* --- plates: a slow, floating forward glide with depth of field --- */
let plate = null, glide = null;
function makePlate(ph) {
  const el = document.createElement("div");
  el.className = "plate" + (ph ? "" : " fallback");
  el.innerHTML = `<div class="move"><div class="soft"></div><div class="sharp"></div></div>`;
  if (ph) el.querySelectorAll(".soft,.sharp").forEach(d => d.style.backgroundImage = `url("${ph.src}")`);
  stage.appendChild(el);
  return el;
}
function startGlide(el, drift) {
  if (reduce) return null;
  const [dx, dy] = drift || [0, 0];
  return el.querySelector(".move").animate([
    { transform: "scale(1.04) translate3d(0,0,0)" },
    { transform: `scale(1.17) translate3d(${dx * 1.4}%, ${dy * 1.1}%, 0)` }
  ], { duration: 26000, easing: "cubic-bezier(.25,.1,.25,1)", fill: "forwards" });
}
async function showPlace(s, first) {
  const ph = await getPhoto(s);
  const next = makePlate(ph);
  const old = plate, oldGlide = glide;
  plate = next; glide = startGlide(next, s.drift);
  const cr = $("credit");
  if (ph && ph.credit) { cr.textContent = ph.credit; cr.href = ph.href || "#"; cr.classList.add("has"); } else cr.classList.remove("has");
  if (reduce) { next.style.opacity = 1; if (old) old.remove(); return; }
  next.animate([{ opacity: 0, transform: "scale(1.12)", filter: "blur(10px)" }, { opacity: 1, transform: "scale(1)", filter: "blur(0px)" }],
    { duration: first ? 2200 : 1400, easing: "cubic-bezier(.22,.61,.36,1)", fill: "forwards" });
  $("sweep").animate([{ opacity: 0, transform: "translateX(-30%)" }, { opacity: 1, offset: .4 }, { opacity: 0, transform: "translateX(30%)" }], { duration: 1400, easing: "ease-out" });
  if (old) {
    if (oldGlide) oldGlide.pause();
    const a = old.animate([{ opacity: 1, transform: "scale(1)", filter: "blur(0px)" }, { opacity: 0, transform: "scale(1.22)", filter: "blur(12px)" }],
      { duration: 1200, easing: "cubic-bezier(.55,.06,.68,.19)", fill: "forwards" });
    a.onfinish = () => old.remove();
  }
}

/* --- film grain --- */
(() => {
  const c = $("grain"), g = c.getContext("2d"), img = g.createImageData(c.width, c.height);
  const draw = () => { for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } g.putImageData(img, 0, 0); };
  draw(); if (!reduce) setInterval(draw, 90);
})();

async function setupDitty() {
  for (const ext of ["png", "webp", "jpg", "jpeg"]) {
    const p = `images/ditty.${ext}`;
    if (await loads(p, 3000)) { portraitSrc = p; break; }
  }
  if (portraitSrc) {
    dittyBox.insertAdjacentHTML("beforeend", `<img src="${portraitSrc}" alt="">`);
    $("face").innerHTML = `<img src="${portraitSrc}" alt="">`;
  } else {
    dittyBox.insertAdjacentHTML("beforeend", PORTRAIT);
    $("face").innerHTML = PORTRAIT_MINI;
  }
}
async function introVideo() {
  return new Promise(res => {
    const v = document.createElement("video");
    v.src = "images/ditty-hello.mp4"; v.playsInline = true; v.preload = "auto";
    v.onloadeddata = () => res(v); v.onerror = () => res(null);
    setTimeout(() => res(null), 3500);
  });
}

/* --- her voice --- */
let soundOn = true, voice = null, talkToken = 0;
const hasTTS = "speechSynthesis" in window;
function pickVoice() {
  if (!hasTTS) return; const vs = speechSynthesis.getVoices(); if (!vs.length) return;
  const prefs = [/Neerja/i, /Veena/i, /Heera/i, /Swara/i, /Sonia/i, /Libby/i, /Google UK English Female/i, /Aria/i, /Jenny/i, /Samantha/i, /Moira/i, /Karen/i, /Zira/i, /female/i];
  for (const p of prefs) { const v = vs.find(v => p.test(v.name) && /^en/i.test(v.lang)); if (v) { voice = v; return; } }
  voice = vs.find(v => /en-IN/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const narrator = $("narrator"), lineEl = $("line");
function hush() { talkToken++; if (hasTTS) speechSynthesis.cancel(); narrator.classList.remove("talking"); document.body.classList.remove("speaking"); }
function talk(text) {
  hush(); const tok = talkToken;
  const parts = text.match(/[^.!?]+[.!?]+/g) || [text]; let k = 0;
  narrator.classList.add("show");
  const nxt = () => {
    if (tok !== talkToken) return;
    if (k >= parts.length) { narrator.classList.remove("talking"); document.body.classList.remove("speaking"); return; }
    const s = parts[k++].trim(); lineEl.textContent = s;
    narrator.classList.add("talking"); document.body.classList.add("speaking");
    if (soundOn && hasTTS) {
      const u = new SpeechSynthesisUtterance(s);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
      u.rate = 1.0; u.pitch = 1.08;
      let done = false; const fin = () => { if (done) return; done = true; document.body.classList.remove("speaking"); setTimeout(nxt, 180); };
      u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
      setTimeout(() => { if (!done && !speechSynthesis.speaking) fin(); }, 2200 + s.length * 110);
    } else setTimeout(() => { document.body.classList.remove("speaking"); setTimeout(nxt, 150); }, 600 + s.length * 48);
  };
  nxt();
}
const vbtn = $("voice");
const setV = () => { vbtn.textContent = soundOn ? "Sound on" : "Sound off"; vbtn.setAttribute("aria-pressed", soundOn); };
vbtn.addEventListener("click", () => { soundOn = !soundOn; setV(); if (!soundOn && hasTTS) speechSynthesis.cancel(); });
if (!hasTTS) { soundOn = false; vbtn.hidden = true; }

/* --- journey --- */
const caption = $("caption"), panel = $("panel");
const stepsEl = $("steps");
stepsEl.innerHTML = SCENES.map((s, i) => `<li><button data-i="${i}">${s.step}</button></li>`).join("");
let cur = -1, busy = false;
function markSteps() {
  [...stepsEl.querySelectorAll("button")].forEach((b, j) => {
    b.classList.toggle("on", j === cur); b.classList.toggle("done", j < cur);
    if (j === cur) { b.setAttribute("aria-current", "step"); b.scrollIntoView({ inline: "center", block: "nearest", behavior: reduce ? "auto" : "smooth" }); }
    else b.removeAttribute("aria-current");
  });
  $("prev").disabled = cur <= 0;
  $("next").setAttribute("aria-label", cur === SCENES.length - 1 ? "Back to the start" : "Next place");
}
async function go(i) {
  if (busy) return;
  if (i >= SCENES.length) i = 0;
  if (i < 0 || i === cur) return;
  busy = true; hush(); narrator.classList.remove("show");
  const s = SCENES[i];
  caption.classList.remove("in"); panel.classList.remove("in");
  getPhoto(s);
  await wait(reduce ? 0 : 350);
  await showPlace(s);
  cur = i; markSteps();
  caption.querySelector(".chap").textContent = s.chap;
  caption.querySelector("h2").textContent = s.place;
  caption.querySelector(".year").textContent = s.year;
  panel.innerHTML = s.html; panel.scrollTop = 0;
  await wait(reduce ? 0 : 450);
  caption.classList.add("in");
  await wait(reduce ? 0 : 250);
  panel.classList.add("in");
  talk(s.talk);
  if (SCENES[i + 1]) getPhoto(SCENES[i + 1]);
  busy = false;
}
$("next").addEventListener("click", () => go(cur + 1));
$("prev").addEventListener("click", () => go(cur - 1));
stepsEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
addEventListener("keydown", e => {
  if (!document.body.classList.contains("journey")) return;
  if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
});
let acc = 0, wt;
addEventListener("wheel", e => {
  if (!document.body.classList.contains("journey")) return;
  if (e.target.closest && e.target.closest("#panel")) {
    const top = panel.scrollTop <= 0, bottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 2;
    if ((e.deltaY > 0 && !bottom) || (e.deltaY < 0 && !top)) return;
  }
  acc += e.deltaY; clearTimeout(wt); wt = setTimeout(() => acc = 0, 200);
  if (acc > 60) { acc = 0; if (cur < SCENES.length - 1) go(cur + 1); }
  if (acc < -60) { acc = 0; go(cur - 1); }
}, { passive: true });
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (!document.body.classList.contains("journey")) return;
  if (e.target.closest && e.target.closest("#panel, a, button")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 45) return;
  (Math.abs(dx) > Math.abs(dy) ? dx < 0 : dy < 0) ? (cur < SCENES.length - 1 && go(cur + 1)) : go(cur - 1);
}, { passive: true });

/* --- the opening: she comes in and says hi --- */
SCENES.forEach(getPhoto); getPhoto(INTRO);
const dittyReady = setupDitty();
const videoReady = introVideo();
showPlace(INTRO, true);

async function enter(withSound) {
  soundOn = withSound && hasTTS; setV();
  if (soundOn) { pickVoice(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }
  $("splash").classList.add("gone");
  document.body.classList.add("on");
  await dittyReady;
  const v = await videoReady;
  if (v) { dittyBox.querySelectorAll("img,svg").forEach(n => n.remove()); dittyBox.appendChild(v); }
  await wait(reduce ? 0 : 500);
  dittyBox.classList.add("in");
  await wait(reduce ? 0 : 900);
  $("hello").classList.add("in");
  if (v) { v.muted = !soundOn; v.play().catch(() => {}); narrator.classList.add("show"); lineEl.textContent = INTRO.talk; }
  else talk(INTRO.talk);
}
$("enter").addEventListener("click", () => enter(true));
$("quiet").addEventListener("click", () => enter(false));
$("begin").addEventListener("click", async () => {
  hush();
  const v = dittyBox.querySelector("video"); if (v) v.pause();
  $("hello").classList.add("out"); dittyBox.classList.add("out");
  await wait(reduce ? 0 : 500);
  document.body.classList.add("journey");
  go(0);
});
</script>
