<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ditty Denny, Software & Data Engineer</title>
<meta name="description" content="Walk through Ditty Denny’s journey: from Thrissur to Qatar to Scotland and back, building with software and data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
@property --sky1{syntax:'<color>';inherits:true;initial-value:#7EC8F0}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#FFE3B8}
@property --ground{syntax:'<color>';inherits:true;initial-value:#5FA35A}
:root{
  --card:#FFFFFFF2; --ink:#1D2333; --muted:#596179; --line:#E2E5EE; --accent:#6A45D1; --accent-ink:#FFFFFF; --gold:#B7791F; --dim:transparent;
  --ch:clamp(170px,30vh,270px); --feet:13vh;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --card:#1B2131F2; --ink:#EEF1F8; --muted:#A7B0C6; --line:#30384C; --accent:#A68CFF; --accent-ink:#17121F; --gold:#E7B460; --dim:rgba(8,12,28,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --card:#1B2131F2; --ink:#EEF1F8; --muted:#A7B0C6; --line:#30384C; --accent:#A68CFF; --accent-ink:#17121F; --gold:#E7B460; --dim:rgba(8,12,28,.28);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#7EC8F0;color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--accent);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}

#stage{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(to bottom,var(--sky1),var(--sky2));
  transition:--sky1 1.6s ease,--sky2 1.6s ease,--ground 1.6s ease}
#stage::after{content:"";position:absolute;inset:0;background:var(--dim);pointer-events:none;z-index:4}
#sun{position:absolute;width:11vmin;height:11vmin;border-radius:50%;right:12vw;top:16vh;
  background:radial-gradient(circle,#FFF6D8 0 45%,#FFD27A 46% 100%);box-shadow:0 0 60px 20px rgba(255,214,130,.45)}
#clouds{position:absolute;inset:0 auto auto 0;width:400vw;height:45vh;transition:transform 1.6s cubic-bezier(.45,.05,.4,1)}
.cloud{position:absolute;height:5vmin;background:#FFFFFFD9;border-radius:99px}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:45%;aspect-ratio:1;left:14%;bottom:30%}
.cloud::after{width:32%;aspect-ratio:1;left:50%;bottom:35%}

#world{position:absolute;inset:0;display:flex;transition:transform 1.6s cubic-bezier(.45,.05,.4,1)}
.panel{position:relative;height:100%;flex:none}
.landmark{position:absolute;left:30%;bottom:calc(20vh - 2px);width:min(36vw,560px);z-index:1}
.landmark svg{display:block;width:100%;height:auto;overflow:visible}

#ground{position:absolute;left:0;right:0;bottom:0;height:20vh;background:var(--ground);z-index:2}
#ground::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:rgba(0,0,0,.08)}
#path{position:absolute;left:0;right:0;bottom:calc(var(--feet) - 2.2vh);height:5vh;
  background-color:rgba(255,240,215,.55);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.75) 0 40px,transparent 40px 90px);
  background-size:90px 4px;background-repeat:repeat-x;background-position:0 50%;
  transition:background-position 1.6s cubic-bezier(.45,.05,.4,1)}

/* Character */
#girl{position:absolute;left:14vw;bottom:var(--feet);height:var(--ch);z-index:5;
  transition:transform 1.8s cubic-bezier(.3,.1,.3,1)}
#girl .face{height:100%;transition:transform .25s}
#girl.back .face{transform:scaleX(-1)}
#girl svg{height:100%;width:auto;display:block;overflow:visible}
.limb{transform-box:fill-box;transform-origin:50% 4%}
.walking .legF{animation:legA .55s ease-in-out infinite alternate}
.walking .legB{animation:legB .55s ease-in-out infinite alternate}
.walking .armF{animation:legB .55s ease-in-out infinite alternate}
.walking .armB{animation:legA .55s ease-in-out infinite alternate}
.walking .bob{animation:bob .275s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes legB{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.waving .armF{animation:wave .7s ease-in-out 3 alternate;transform:rotate(-150deg)}
@keyframes wave{0%{transform:rotate(-135deg)}100%{transform:rotate(-170deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

#bubble{position:absolute;left:calc(14vw + var(--ch) * .28);bottom:calc(var(--feet) + var(--ch) + 14px);
  z-index:6;max-width:min(19rem,70vw);background:var(--card);color:var(--ink);
  padding:.75rem 1rem;border-radius:18px 18px 18px 4px;font-weight:600;font-size:1.05rem;line-height:1.35;
  box-shadow:0 10px 30px rgba(20,25,50,.18);opacity:0;transform:translateY(8px) scale(.96);transform-origin:0 100%;
  transition:opacity .3s,transform .3s}
#bubble.show{opacity:1;transform:none}

/* Info card */
#card{position:absolute;z-index:7;right:5vw;top:calc(12vh + env(safe-area-inset-top,0px));width:min(30rem,40vw);max-height:56vh;overflow:auto;
  background:var(--card);color:var(--ink);border-radius:22px;padding:1.6rem 1.7rem;
  box-shadow:0 20px 60px rgba(20,25,50,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s;pointer-events:none}
#card.show{opacity:1;transform:none;pointer-events:auto}
#card .when{color:var(--gold);font-weight:700;margin:0 0 .3rem}
#card h2{font-size:clamp(1.5rem,2.6vw,2.15rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 .3rem;font-weight:800}
#card .where{color:var(--muted);margin:0 0 1rem;font-weight:600}
#card p{margin:0 0 .8rem;line-height:1.55}
#card ul.items{list-style:none;padding:0;margin:.2rem 0 .6rem}
#card ul.items li{padding:.55rem 0;border-top:1px solid var(--line)}
#card ul.items li:first-child{border-top:0}
#card ul.items b{display:block}
#card ul.items span{color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:.4rem 0 .8rem}
.tags li{font-size:.85rem;padding:.2rem .65rem;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.badges{display:grid;gap:.6rem;margin:.6rem 0}
.badge{border-left:4px solid var(--gold);padding:.2rem 0 .2rem .8rem;font-weight:600}
.big-name{font-size:clamp(2.2rem,4.4vw,3.4rem)!important}
.hint{color:var(--muted);font-size:.95rem;margin-top:.4rem}
.btnrow{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.6rem}
.btnrow a{display:inline-block;text-decoration:none;padding:.6rem 1rem;border-radius:99px;border:2px solid var(--accent)}
.btnrow a.primary{background:var(--accent);color:var(--accent-ink)}

/* Progress */
#progress{position:absolute;z-index:8;top:calc(1.2rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  display:flex;gap:.35rem;list-style:none;margin:0;padding:.45rem .6rem;border-radius:99px;background:var(--card);
  box-shadow:0 6px 20px rgba(20,25,50,.12);max-width:calc(100vw - 2rem)}
#progress button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--line);transition:background .3s,width .3s}
#progress button.on{background:var(--accent);width:28px;border-radius:99px}
#progress button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}

/* Controls */
#controls{position:absolute;z-index:8;right:5vw;bottom:calc(3.5vh + env(safe-area-inset-bottom,0px));display:flex;gap:.6rem;align-items:center}
#controls button{border:0;border-radius:99px;font-weight:700;box-shadow:0 8px 24px rgba(20,25,50,.2)}
#prev{width:3.2rem;height:3.2rem;background:var(--card);color:var(--ink);font-size:1.3rem}
#next{height:3.2rem;padding:0 1.5rem;background:var(--accent);color:var(--accent-ink);font-size:1.05rem}
#controls button:disabled{opacity:.4;cursor:default}

.blinky{animation:led 1.2s steps(1) infinite}
.blinky.d2{animation-delay:.4s}.blinky.d3{animation-delay:.8s}
@keyframes led{50%{opacity:.25}}

@media (max-width:760px){
  :root{--ch:clamp(130px,22vh,180px);--feet:11vh}
  #girl{left:6vw}
  #bubble{left:calc(6vw + var(--ch) * .3);font-size:.95rem}
  #card{left:.9rem;right:.9rem;width:auto;top:calc(3.6rem + env(safe-area-inset-top,0px));max-height:44vh;padding:1.2rem 1.25rem;border-radius:18px}
  .landmark{left:38%;width:62vw}
  #controls{right:.9rem;bottom:calc(2.5vh + env(safe-area-inset-bottom,0px))}
  #sun{right:8vw;top:auto;bottom:52vh}
}
@media (prefers-reduced-motion:reduce){
  #world,#clouds,#path,#girl,#stage{transition:none!important}
  .walking *,.waving *,.eye,.blinky{animation:none!important}
}
</style>
</head>
<body>
<div id="stage" aria-live="polite">
  <div id="sun"></div>
  <div id="clouds" aria-hidden="true"></div>
  <div id="world" aria-hidden="true"></div>
  <div id="ground" aria-hidden="true"><div id="path"></div></div>

  <div id="girl" aria-hidden="true">
    <div class="face">
      <svg viewBox="0 0 120 212" xmlns="http://www.w3.org/2000/svg">
        <g class="bob">
          <path d="M45 30 C 24 42, 22 82, 32 116 C 36 98, 40 70, 52 48 Z" fill="#1B1210"/>
          <g class="limb armB"><rect x="55" y="72" width="10" height="30" rx="5" fill="#5A39B0"/><rect x="56" y="96" width="8" height="28" rx="4" fill="#8E5734"/><circle cx="60" cy="126" r="5" fill="#8E5734"/></g>
          <g class="limb legB"><rect x="54" y="132" width="12" height="68" rx="5" fill="#1C2338"/><path d="M53 196 h18 a6 6 0 0 1 0 11 h-18 z" fill="#3A2A22"/></g>
          <g class="limb legF"><rect x="54" y="132" width="12" height="68" rx="5" fill="#26304A"/><path d="M53 196 h18 a6 6 0 0 1 0 11 h-18 z" fill="#4A372C"/></g>
          <rect x="55" y="56" width="10" height="14" fill="#A0663F"/>
          <path d="M46 69 Q60 63 74 69 L81 140 Q60 147 39 140 Z" fill="#7B4FD6"/>
          <path d="M47 70 L54 68 L60 79 L66 68 L73 70" fill="none" stroke="#F3C969" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M41 130 Q60 136 79 130" stroke="#F3C969" stroke-width="3" fill="none"/>
          <circle cx="60" cy="36" r="21" fill="#A0663F"/>
          <path d="M38 40 C 35 17, 52 11, 62 13 C 77 13, 85 25, 81 37 C 74 27, 64 23, 52 27 C 46 30, 42 35, 38 40 Z" fill="#1B1210"/>
          <path d="M39 36 C 37 48, 41 55, 47 58 L 50 34 Z" fill="#1B1210"/>

          <circle cx="51" cy="40" r="3.4" fill="#8E5734"/>

          <circle cx="74" cy="42" r="3" fill="#E58A7A" opacity=".45"/>
          <path d="M67 45 q5 4 10 -1" stroke="#5A2E1C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <g class="limb armF"><rect x="55" y="72" width="10" height="30" rx="5" fill="#8B61E3"/><rect x="56" y="96" width="8" height="28" rx="4" fill="#A0663F"/><circle cx="60" cy="126" r="5" fill="#A0663F"/></g>
        </g>
      </svg>
    </div>
  </div>
  <div id="bubble"></div>

  <article id="card" tabindex="-1"></article>

  <ol id="progress" aria-label="Journey stops"></ol>
  <div id="controls">
    <button id="prev" aria-label="Previous stop">‹</button>
    <button id="next">Walk with me</button>
  </div>
</div>

<script>
/* ---------- Scenery pieces ---------- */
const palm = (x, s = 1, f = 1) => `<g transform="translate(${x} 260) scale(${s * f} ${s})">
  <path d="M0 0 C 4 -40, -6 -90, 10 -140" stroke="#7A5230" stroke-width="9" fill="none" stroke-linecap="round"/>

    <path d="M0 0 C 10 -25, 35 -40, 62 -34 C 35 -30, 15 -15, 0 0Z" fill="#3BA16A"/><path d="M0 0 C -10 -25, -35 -40, -62 -34 C -35 -30, -15 -15, 0 0Z" fill="#3BA16A"/>
    <path d="M0 0 C 6 -20, 5 -42, 0 -56 C -5 -42, -6 -20, 0 0Z"/>

const svg = inner => `<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const LAND = {
  kerala: svg(`<rect x="-140" y="228" width="680" height="32" rx="16" fill="#3E8EB5" opacity=".85"/>
    <path d="M-120 236 h640" stroke="#BFE3F2" stroke-width="2" stroke-dasharray="18 26"/>
    <g transform="translate(150 196)"><path d="M0 30 Q 70 46 150 30 L 140 40 Q 70 52 10 40 Z" fill="#6B3F20"/>

  college: svg(`<rect x="70" y="120" width="260" height="140" fill="#F3E8D2"/>
    <path d="M55 124 L200 62 L345 124 Z" fill="#B24A33"/><rect x="55" y="122" width="290" height="8" fill="#8F3A27"/>

    ${[95,140,245,290].map(x => `<path d="M${x} 230 V160 a14 14 0 0 1 28 0 V230 Z" fill="#6E8FB5"/>`).join("")}

  firsts: svg(`<rect x="40" y="110" width="110" height="150" fill="#E7ECF5"/><rect x="160" y="70" width="90" height="190" fill="#CFD8EA"/>

    <polyline points="282,152 305,138 325,144 345,118 366,104" fill="none" stroke="#6A45D1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  dataeng: svg(`<rect x="60" y="100" width="90" height="160" rx="6" fill="#2D3550"/>
    ${[0,1,2,3,4,5].map(i => `<rect x="70" y="${112 + i * 24}" width="70" height="16" rx="3" fill="#3E4868"/><circle class="blinky ${i % 3 === 1 ? 'd2' : i % 3 === 2 ? 'd3' : ''}" cx="130" cy="${120 + i * 24}" r="3" fill="#5BE3A1"/>`).join("")}
    <g fill="#6A45D1">${[0,1,2].map(i => `<ellipse cx="240" cy="${236 - i * 38}" rx="50" ry="14" fill="#8B6CF0"/><rect x="190" y="${200 - i * 38}" width="100" height="36" fill="#6A45D1"/>`).join("")}

    <rect x="310" y="150" width="70" height="110" rx="6" fill="#2D3550"/>${[0,1,2,3].map(i => `<rect x="318" y="${160 + i * 24}" width="54" height="14" rx="3" fill="#3E4868"/>`).join("")}`),
  qatar: svg(`<path d="M-200 260 C -100 230, 40 210, 110 225 C 140 232, 160 240, 170 245 C 230 220, 320 205, 440 236 C 500 248, 560 252, 620 260 Z" fill="#E9C48C"/>
    <rect x="140" y="80" width="30" height="170" fill="#5D7FA8"/><path d="M190 250 V60 Q 215 30 240 60 V250 Z" fill="#3E6290"/>

  falkirk: svg(`<rect x="-140" y="232" width="680" height="28" rx="14" fill="#4F86B8"/>

    ${[[20,180],[70,195],[330,185]].map(([x, y]) => `<rect x="${x}" y="${y}" width="44" height="${232 - y}" fill="#E3D9CC"/><path d="M${x - 4} ${y} L${x + 22} ${y - 26} L${x + 48} ${y} Z" fill="#5B4A44"/><rect x="${x + 16}" y="${y + 18}" width="12" height="14" fill="#F3C969"/>`).join("")}`),
  today: svg(`<rect x="130" y="40" width="130" height="220" fill="#BFD7EE"/><rect x="130" y="40" width="130" height="220" fill="url(#g1)"/>
    <defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/><stop offset="1" stop-color="#6A8FC0" stop-opacity=".25"/></linearGradient></defs>
    ${[0,1,2,3,4,5,6].map(r => `<path d="M130 ${70 + r * 28} H260" stroke="#E9F2FB" stroke-width="2"/>`).join("")}
    <path d="M195 40 V260" stroke="#E9F2FB" stroke-width="2"/>
    <rect x="270" y="120" width="110" height="80" rx="8" fill="#23293D"/><rect x="278" y="128" width="94" height="58" rx="3" fill="#2F3753"/>
    <text x="325" y="164" text-anchor="middle" font-family="monospace" font-size="22" fill="#9EF0C2">&lt;/&gt;</text>

const LABELS = ["Hello", "College", "First steps", "Data Engineer", "Qatar", "Scotland", "Falkirk", "Today", "Toolkit", "Projects", "Contact"];

/* ---------- Build the world ---------- */
const N = SCENES.length;
const $ = id => document.getElementById(id);
const stage = $("stage"), world = $("world"), clouds = $("clouds"), path = $("path");
const girl = $("girl"), bubble = $("bubble"), card = $("card"), next = $("next"), prev = $("prev"), progress = $("progress");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

world.style.width = `${N * 100}vw`;
world.innerHTML = SCENES.map(s => `<div class="panel" style="width:100vw"><div class="landmark">${LAND[s.land]}</div></div>`).join("");
clouds.style.width = `${N * 40 + 120}vw`;
let cl = "";
for (let i = 0; i < N * 2 + 3; i++) {
  const w = 8 + ((i * 37) % 9);
  cl += `<div class="cloud" style="left:${i * 22 + ((i * 13) % 9)}vw;top:${6 + ((i * 29) % 26)}vh;width:${w}vmin;opacity:${0.6 + ((i * 7) % 4) / 10}"></div>`;
}
clouds.innerHTML = cl;
progress.innerHTML = LABELS.map((l, i) => `<li><button aria-label="Go to ${l}" title="${l}" data-i="${i}"></button></li>`).join("");

function setSky(i) {
  stage.style.setProperty("--sky1", SCENES[i].sky[0]);
  stage.style.setProperty("--sky2", SCENES[i].sky[1]);
  stage.style.setProperty("--ground", SCENES[i].ground);
  document.body.style.background = SCENES[i].sky[0];
}

let typer;
function say(text) {
  clearInterval(typer);
  bubble.textContent = "";
  bubble.classList.add("show");
  if (reduce) { bubble.textContent = text; return; }
  const chars = Array.from(text);
  let k = 0;
  typer = setInterval(() => {
    bubble.textContent += chars[k++];
    if (k >= chars.length) clearInterval(typer);
  }, 32);
}

function arrive(i) {
  const s = SCENES[i];
  card.innerHTML = s.html;
  card.scrollTop = 0;
  card.classList.add("show");
  say(s.say);
  girl.classList.remove("back");
  if (s.wave && !reduce) {
    girl.classList.add("waving");
    setTimeout(() => girl.classList.remove("waving"), 2200);
  }
  [...progress.querySelectorAll("button")].forEach((b, j) => {
    b.classList.toggle("on", j === i);
    b.classList.toggle("done", j < i);
    b.setAttribute("aria-current", j === i ? "step" : "false");
  });
  prev.disabled = i === 0;
  next.textContent = i === 0 ? "Walk with me" : i === N - 1 ? "Walk again" : "Next stop";
}

let cur = 0, busy = false;
function go(target) {
  if (busy) return;
  if (target >= N) target = 0;
  if (target < 0 || target === cur) return;
  busy = true;
  const steps = Math.abs(target - cur);
  const d = reduce ? 0 : Math.min(1500 + (steps - 1) * 450, 3600);
  card.classList.remove("show");
  bubble.classList.remove("show");
  girl.classList.toggle("back", target < cur);
  girl.classList.remove("waving");
  if (d) girl.classList.add("walking");
  const t = `${d}ms cubic-bezier(.45,.05,.4,1)`;
  world.style.transition = `transform ${t}`;
  clouds.style.transition = `transform ${t}`;
  path.style.transition = `background-position ${t}`;
  stage.style.transition = `--sky1 ${d}ms ease, --sky2 ${d}ms ease, --ground ${d}ms ease`;
  world.style.transform = `translateX(${-target * 100}vw)`;
  clouds.style.transform = `translateX(${-target * 22}vw)`;
  path.style.backgroundPosition = `${-target * 100}vw 50%`;
  setSky(target);
  setTimeout(() => {
    girl.classList.remove("walking");
    cur = target;
    arrive(cur);
    busy = false;
  }, d + 60);
}

next.addEventListener("click", () => go(cur + 1));
prev.addEventListener("click", () => go(cur - 1));
progress.addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.i); });
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("a")) return;
  if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); go(cur - 1); }
});
let acc = 0, wheelTimer;
addEventListener("wheel", e => {
  const inCard = e.target.closest && e.target.closest("#card");
  if (inCard) {
    const atTop = card.scrollTop <= 0, atBottom = card.scrollTop + card.clientHeight >= card.scrollHeight - 2;
    if ((e.deltaY > 0 && !atBottom) || (e.deltaY < 0 && !atTop)) return;
  }
  acc += e.deltaY + e.deltaX;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => acc = 0, 220);
  if (acc > 70) { acc = 0; if (cur < N - 1) go(cur + 1); }
  if (acc < -70) { acc = 0; go(cur - 1); }
}, { passive: true });
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  if (e.target.closest && e.target.closest("#card, a, button")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 45) return;
  const forward = Math.abs(dx) > Math.abs(dy) ? dx < 0 : dy < 0;
  forward ? (cur < N - 1 && go(cur + 1)) : go(cur - 1);
}, { passive: true });

/* ---------- Opening: she walks in and says hi ---------- */
setSky(0);
prev.disabled = true;
[...progress.querySelectorAll("button")][0].classList.add("on");
if (reduce) {
  arrive(0);
} else {
  busy = true;
  girl.style.transition = "none";
  girl.style.transform = "translateX(-40vw)";
  girl.classList.add("walking");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    girl.style.transition = "";
    girl.style.transform = "translateX(0)";
  }));
  setTimeout(() => { girl.classList.remove("walking"); arrive(0); busy = false; }, 1900);
}
</script>
